# Local trial overlay (NOT for servers). Docker's VM here has ~3.9 GB, too small to also hold the 2.6 GB models, so the
# API uses the Ollama already running on the host (same local-only models). That requires the API to reach the host,
# so it joins the 'public' network in this overlay -- on a real server it stays internal-only (see compose.yml).
services:
  # Loopback-only host ports so the host-side demo seeder can reach the database and API. Never on a server.
  postgres:
    ports: ["127.0.0.1:5434:5432"]
    networks: !override [internal, public]
  ollama:
    profiles: ["models"]
  backend:
    environment:
      LOCAL_AI_ENABLED: "true"
      LOCAL_AI_BASE_URL: http://host.docker.internal:11434
    ports: ["127.0.0.1:8010:8000"]
    # A named volume, not a bind mount: Docker Desktop's file-share read of the 1.9 GB translation model failed with
    # 'Out of memory' in a 4 GB VM. Fill it once with `docker cp` (see README section 8).
    volumes: !override
      - workmate_voice:/app/data/voice:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: !override [internal, public]
    depends_on: !override
      migrate:
        condition: service_completed_successfully

volumes:
  workmate_voice:
    external: true
