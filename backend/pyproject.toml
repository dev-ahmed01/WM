[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workmate-ai-backend"
version = "0.1.0"
description = "FastAPI backend for WorkMate AI Enterprise Operational Intelligence Platform"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "snowflake-connector-python>=3.7.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "faster-whisper>=1.1.0,<2.0.0",
    "ctranslate2>=4.5.0,<5.0.0",
    "sentencepiece>=0.2.0,<1.0.0",
    "piper-tts>=1.4.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
