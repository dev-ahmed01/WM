services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workmate_dev_only}
      POSTGRES_DB: workmate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workmate -d workmate"]
      interval: 5s
      retries: 15
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    container_name: workmate_frontend
    environment:
      WORKMATE_INTERNAL_API_URL: http://backend:8000/api/v1
      APP_ENV: dev
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: workmate_ollama
    environment:
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: workmate_ollama_model_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_CHAT_MODEL: ${LOCAL_CHAT_MODEL:-qwen2.5:3b}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "$${LOCAL_CHAT_MODEL}" &&
        ollama pull "$${LOCAL_EMBEDDING_MODEL}" &&
        ollama show "$${LOCAL_CHAT_MODEL}" >/dev/null &&
        ollama show "$${LOCAL_EMBEDDING_MODEL}" >/dev/null
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: workmate_backend
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    environment:
      LOCAL_AI_BASE_URL: http://ollama:11434
      VOICE_PREWARM_MODELS: "true"
      DATABASE_URL: postgresql://workmate:${POSTGRES_PASSWORD:-workmate_dev_only}@postgres:5432/workmate
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "python scripts/migrate_postgres.py && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ./backend/app:/app/app
      - voice_whisper_data:/app/data/voice/whisper
      - voice_audio_data:/app/data/voice/audio
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  voice_whisper_data:
  voice_audio_data:
