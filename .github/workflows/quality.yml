name: WorkMate quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  document-extraction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workmate
          POSTGRES_PASSWORD: workmate_ci_password
          POSTGRES_DB: workmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workmate -d workmate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install private OCR engine and English/Hindi traineddata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin fonts-dejavu-core
          tesseract --list-langs
      - name: Install preview test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio bcrypt PyYAML fastapi httpx pydantic-settings python-multipart 'python-jose[cryptography]' 'psycopg[binary]>=3.2,<4' 'psycopg-pool>=3.2,<4' 'pypdf>=5,<7' 'python-docx>=1.2,<2' 'openpyxl>=3.1.5,<4' 'python-pptx>=1.0.2,<2' 'beautifulsoup4>=4.12,<5' 'striprtf>=0.0.26,<1' 'Pillow>=10.4,<12' 'pytesseract>=0.3.13,<1' 'pypdfium2>=4.30,<5'
      - name: Apply PostgreSQL baseline and integration checks
        env:
          DATABASE_URL: postgresql://workmate:workmate_ci_password@localhost:5432/workmate
          PYTHONPATH: backend
          WORKMATE_RUN_LIVE_TESTS: "1"
        run: |
          python scripts/migrate_postgres.py
          python scripts/migrate_postgres.py
          python -m pytest -q backend/tests/test_postgres_integration.py backend/tests/test_postgres_api_integration.py
      - name: Verify PostgreSQL backup and restored source bytes
        env:
          DATABASE_URL: postgresql://workmate:workmate_ci_password@localhost:5432/workmate
          WORKMATE_BACKUP_SMOKE: "1"
        run: |
          sudo apt-get install -y postgresql-client
          python scripts/verify_postgres_restore.py
      - name: Verify document extraction and abuse cases
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_release_security.py backend/tests/test_main.py backend/tests/test_auth_rbac_middleware.py backend/tests/test_database.py backend/tests/test_owd_compiler_subsystem.py backend/tests/test_voice_api.py backend/tests/test_voice_quality.py backend/tests/test_document_extraction.py backend/tests/test_reference_library.py backend/tests/test_reference_answer.py backend/tests/test_reference_hybrid.py backend/tests/test_reference_quality_smoke.py backend/tests/test_private_ocr.py backend/tests/test_copilot_retrieval_validation.py backend/tests/test_grounding_validation.py backend/tests/test_auth_routes.py backend/tests/test_workflow_session_repository.py backend/tests/test_workflow_state.py backend/tests/test_intelligence_hub.py backend/tests/test_copilot_history.py
      - name: Publish offline synthetic QA metrics
        env:
          PYTHONPATH: backend
          JWT_SECRET: unit-test-jwt-secret-with-32-characters
          INTERNAL_WEBHOOK_SECRET: unit-test-webhook-secret
        run: python backend/evals/reference_quality_smoke.py

      - name: Publish voice metric fixture sanity (not field ASR accuracy)
        env:
          PYTHONPATH: backend
        run: python backend/evals/voice_quality.py --manifest backend/evals/fixtures/voice_metric_sanity.json



  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
